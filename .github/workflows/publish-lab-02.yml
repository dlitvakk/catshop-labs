name: publish-lab-02

on:
  push:
    branches: [lab-02]
    paths: ["lab-02/**", ".github/workflows/publish-lab-02.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: lab-02
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ runner.os }}-${{ hashFiles('lab-02/requirements.txt', 'lab-02/requirements-dev.txt') }}
          restore-keys: pip-${{ runner.os }}-

      - run: pip install -r requirements.txt -r requirements-dev.txt
      - run: python -m pytest tests -q

  publish:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@v4

      - name: Image name
        id: img
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/catshop-lab-02" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: lab-02
          push: true
          tags: ${{ steps.img.outputs.name }}:${{ github.sha }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Published reference (paste into lab-02/published.txt)
        run: |
          ref="${{ steps.img.outputs.name }}@${{ steps.build.outputs.digest }}"
          echo "$ref"
          {
            echo '### Published image'
            echo
            echo '```'
            echo "$ref"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
